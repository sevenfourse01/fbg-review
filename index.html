<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The name (Adam, 2026-09-03): Headroom — the quantity the engine computes,
      the space between where they are and where the constraint binds. A thing
      under The Mission Automation, not a product word on the page: it lives
      in the tab and in About, nowhere a screen reads.
    -->
    <title>Headroom · The Mission Automation</title>
    <!-- no icon yet: an empty data URL stops the browser's default /favicon.ico request 404ing in the console -->
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script type="module" crossorigin src="/fbg-review/assets/index-BboalKfB.js"></script>
    <link rel="stylesheet" crossorigin href="/fbg-review/assets/index-Dw39fHG7.css">
  </head>
  <body>
    <!--
      THE SURFACE (Adam, 2026-09-02). Everything a prospect reads is in
      surface/copy.ts, in order; nothing else is on the page.

      Regions, in the order they are read:
        #seam     the honesty seam — appears only when the loader refuses
                  the pack for the demo surface; not part of the page
        #cloud    THE ROOM (Adam, 2026-09-05): the middle of the viewport,
                  present from first paint (the global prior), takes shape
                  at the second screen, tightens with every answer, deforms
                  under the handle. Two hairlines — the baseline and the
                  median — and no number: it is drawn, never labelled.
        #screens  the caption under the room: the way in and the five
                  screens after it, one question each, one persistent
                  element that changes in place
        #answer   the reason line from screen two (light), the sentence when
                  it lands, the handle, one action, keep this
        #site     three words. About. Privacy. Contact.
    -->
    <a class="skip-link" href="#screens">Skip to the question</a>

    <div id="seam" role="status"></div>

    <main id="surface">
      <div id="cloud" class="cloud" aria-hidden="false">
        <canvas id="cloud-canvas" role="img" aria-describedby="cloud-a11y"></canvas>
        <!-- the baseline (zero uplift: where they are now) and the median, positioned by surface/cloud.ts -->
        <div class="cloud__hair cloud__hair--baseline" data-slot="hair-baseline" aria-hidden="true" hidden></div>
        <div class="cloud__hair cloud__hair--median" data-slot="hair-median" aria-hidden="true" hidden></div>
        <p id="cloud-a11y" class="visually-hidden"></p>
      </div>

      <section id="screens" class="screens" aria-live="polite"></section>

      <section id="answer" class="answer"></section>
    </main>

    <footer id="site" class="site"></footer>

  </body>
</html>
