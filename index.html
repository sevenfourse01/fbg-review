<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!--
      Mercer: the forecasting surface of The Mission Automation. The name
      lives in the tab, in About and on the export, and nowhere a screen
      reads (design pack ruling 11).
    -->
    <title>Mercer</title>
    <!-- an empty data URL stops the browser's default /favicon.ico request 404ing -->
    <link rel="icon" href="data:," />
    <!--
      THE FONT IS OURS. Sora 300 and 400, Latin, bundled through @fontsource
      from src/main.ts and served from this origin; the two faces are
      preloaded by the plugin in vite.config.ts. Nothing on this page is
      fetched from anyone else's host before an action of theirs:
      test/external.test.ts scans the source, tools/external-requests.mjs
      scans the built bundle, tools/wire-probe.mjs watches the real network.
    -->
    <script type="module" crossorigin src="/fbg-review/assets/index-XdGF5wnB.js"></script>
    <link rel="stylesheet" crossorigin href="/fbg-review/assets/index-DmHNaaPq.css">
    <link rel="preload" as="font" type="font/woff2" crossorigin="" href="/fbg-review/assets/sora-latin-300-normal-cp3Vmaam.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin="" href="/fbg-review/assets/sora-latin-400-normal-CRt88UEn.woff2">
  </head>
  <body>
    <!--
      Two rooms (ruling 1). Everything up to the reveal is on paper; the
      results are in the room. The ids are the contract the probe tools read
      (apps/demo/CONTRACT.md).

        #seam     the honesty seam: shown only when the loader refuses the pack
        #top      wordmark, the data chip, the band, the ledger (sticky on a phone)
        #landing  the promise, the band, the URL field
        #flow     the six panels, one at a time
        #arcs     the six arcs (a strip on a phone, a rail on desktop)
        #room     the results, hidden until the reveal
        #trace    how this was made, expanding in place
        #site     About · Privacy · Contact
    -->
    <a class="skip-link" href="#surface">Skip to the start</a>
    <div id="seam" role="status" hidden></div>
    <header id="top" class="top"></header>
    <main id="surface" tabindex="-1">
      <section id="landing" class="landing"></section>
      <section id="flow" class="flow" hidden></section>
      <section id="room" class="room" tabindex="-1" hidden></section>
      <section id="trace" class="trace" hidden></section>
    </main>
    <nav id="arcs" class="arcs" aria-label="Where you are" hidden></nav>
    <footer id="site" class="site"></footer>
  </body>
</html>
